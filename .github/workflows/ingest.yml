# Scheduled ingest -> pipeline -> alerts -> push, at 08:00, 16:30, 19:00 and 22:00 IST (cron is UTC), plus a
# keep-awake ping every 10 minutes that hits /health only (no database, no model calls).
# The run is idempotent and holds a Postgres advisory lock, so it never overlaps a run triggered from the app or
# from cron-job.org (POST /tasks/ingest). The job fails when every announcement source has failed for 24 hours.
name: ingest
on:
  schedule:
    - cron: "30 2 * * *"      # 08:00 IST: morning catch-up
    - cron: "0 11 * * *"      # 16:30 IST: after the market closes
    - cron: "30 13 * * *"     # 19:00 IST: evening results filings
    - cron: "30 16 * * *"     # 22:00 IST: late filings
    - cron: "*/10 * * * *"    # keep-awake
  workflow_dispatch: {}

concurrency:
  group: finn-ingest
  cancel-in-progress: false

jobs:
  keep-awake:
    if: github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 30 "${{ secrets.FINN_URL }}/health" || true

  ingest:
    if: github.event.schedule != '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CHEAP_MODEL: gemini-3.5-flash
      STRONG_MODEL: gemini-3.8-flash
      EMBED_MODEL: gemini-embedding-2
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tasks.py migrate
      - run: python -m finn.ingest
      - run: python scripts/export_snapshot.py --check
